<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU Demo - Modern Animations</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .info h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .info p {
      opacity: 0.8;
      margin: 0.5rem 0;
    }

    .back-link {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      text-decoration: none;
      color: white;
      transition: background 0.3s;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 2rem;
      background: rgba(255, 0, 0, 0.1);
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="info">
    <h1>WebGPU Demo</h1>
    <p>Next-generation GPU rendering</p>
    <p id="fps">FPS: --</p>
  </div>

  <a href="../index.html" class="back-link">← Back</a>

  <div id="error">
    <h2>WebGPU Not Supported</h2>
    <p>Your browser doesn't support WebGPU yet.</p>
    <p>Try Chrome Canary or Edge Canary with WebGPU flags enabled.</p>
  </div>

  <script type="module">
    import { WebGPURenderer, WebGPUShaders, isWebGPUSupported } from '../src/webgpu/webgpu-core.js';

    const canvas = document.getElementById('canvas');
    const errorDiv = document.getElementById('error');
    const fpsElement = document.getElementById('fps');

    // Check support
    if (!isWebGPUSupported()) {
      errorDiv.style.display = 'block';
      console.error('WebGPU is not supported in this browser');
    } else {
      initWebGPU();
    }

    async function initWebGPU() {
      try {
        // Set canvas size with device pixel ratio
        const dpr = Math.min(window.devicePixelRatio, 2);
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';

        // Initialize renderer
        const renderer = new WebGPURenderer();
        await renderer.init(canvas);

        // Create shaders
        const vertexShader = renderer.createShaderModule(WebGPUShaders.fullscreenVertex);
        const fragmentShader = renderer.createShaderModule(WebGPUShaders.gradientFragment);

        // Create render pipeline
        const pipeline = renderer.createRenderPipeline({
          vertexShader,
          fragmentShader
        });

        // FPS counter
        let lastTime = performance.now();
        let frameCount = 0;

        // Animation loop
        function animate() {
          renderer.render((commandEncoder, renderer) => {
            const passEncoder = renderer.beginRenderPass(commandEncoder, {
              r: 0,
              g: 0,
              b: 0,
              a: 1
            });

            passEncoder.setPipeline(pipeline);
            passEncoder.draw(6, 1, 0, 0);
            passEncoder.end();
          });

          // Update FPS
          frameCount++;
          const currentTime = performance.now();
          if (currentTime - lastTime >= 1000) {
            fpsElement.textContent = `FPS: ${frameCount}`;
            frameCount = 0;
            lastTime = currentTime;
          }

          requestAnimationFrame(animate);
        }

        animate();

        // Handle resize
        window.addEventListener('resize', () => {
          const dpr = Math.min(window.devicePixelRatio, 2);
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
          renderer.resize(canvas.width, canvas.height);
        });

      } catch (error) {
        console.error('WebGPU initialization error:', error);
        errorDiv.style.display = 'block';
        errorDiv.querySelector('p').textContent = error.message;
      }
    }
  </script>
</body>
</html>
