<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Demo - Modern Animations</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: white;
      overflow: hidden;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .info h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(45deg, #f093fb, #f5576c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .info p {
      opacity: 0.8;
      margin: 0.5rem 0;
    }

    .back-link {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      text-decoration: none;
      color: white;
      transition: background 0.3s;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="info">
    <h1>WebGL Demo</h1>
    <p>Interactive fluid simulation with mouse</p>
    <p id="fps">FPS: --</p>
  </div>

  <a href="../index.html" class="back-link">← Back</a>

  <script type="module">
    import { WebGLRenderer } from '../src/webgl/webgl-core.js';
    import { AdvancedWebGLShaders } from '../src/webgl/advanced-shaders.js';

    const canvas = document.getElementById('canvas');
    const fpsElement = document.getElementById('fps');

    // Set canvas size with device pixel ratio
    const dpr = Math.min(window.devicePixelRatio, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';

    // Initialize renderer
    const renderer = new WebGLRenderer();
    renderer.init(canvas);
    const gl = renderer.gl;
    
    // Mouse tracking
    const mouse = { x: 0.5, y: 0.5 };

    canvas.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX / window.innerWidth;
      mouse.y = 1.0 - (e.clientY / window.innerHeight);
    });

    // Create fullscreen quad
    const quadVertices = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
    const vertexBuffer = renderer.createBuffer(quadVertices);

    // Use advanced fluid simulation shader
    const program = renderer.createProgram(
      AdvancedWebGLShaders.fluidVertex,
      AdvancedWebGLShaders.fluidFragment
    );

    const positionLocation = gl.getAttribLocation(program, 'aPosition');
    const timeLocation = gl.getUniformLocation(program, 'uTime');
    const resolutionLocation = gl.getUniformLocation(program, 'uResolution');
    const mouseLocation = gl.getUniformLocation(program, 'uMouse');

    gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
    gl.enableVertexAttribArray(positionLocation);
    gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

    // Animation
    let startTime = Date.now();
    let frameCount = 0;
    let lastTime = performance.now();

    function animate() {
      const currentTime = Date.now();
      const elapsed = (currentTime - startTime) / 1000;

      renderer.clear(0, 0, 0, 1);

      gl.useProgram(program);
      gl.uniform1f(timeLocation, elapsed);
      gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
      gl.uniform2f(mouseLocation, mouse.x, mouse.y);

      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      // Update FPS
      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        fpsElement.textContent = `FPS: ${frameCount}`;
        frameCount = 0;
        lastTime = now;
      }

      requestAnimationFrame(animate);
    }

    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      const dpr = Math.min(window.devicePixelRatio, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      renderer.resize(canvas.width, canvas.height);
    });
  </script>
</body>
</html>
